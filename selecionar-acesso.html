<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selecionar acesso | SESI Biblioteca</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="conteudo-cabecalho">
        <div class="marca">
          <img src="sesi.png" alt="Logo SESI" class="imagem-logo" />
          Biblioteca
        </div>
      </div>
    </header>

    <main>
      <section class="pagina-acesso">
        <div class="cabecalho-acesso">
          <h1>Selecione seu acesso</h1>
          <p>Escolha a conta correta para continuar.</p>
        </div>

        <div class="lista-acesso">
          <article class="cartao-acesso">
            <div>
              <h2>Professor</h2>
              <p>Área exclusiva para professores acessar a biblioteca escolar.</p>
            </div>
            <div>
              <a class="botao-principal" href="login-professor.html">Login</a>
            </div>
          </article>

          <article class="cartao-acesso">
            <div>
              <h2>Aluno</h2>
              <p>Área exclusiva para alunos consultar materiais e acessar sua conta.</p>
            </div>
            <div>
              <a class="botao-principal" href="login.html">Login</a>
              <p class="texto-auxiliar"><a href="cadastro-aluno.html">Não tem conta? Cadastre-se</a></p>
            </div>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
